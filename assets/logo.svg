<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VibeGuard">
  <title>VibeGuard</title>
  <defs>
    <linearGradient id="vg-shell" x1="18" y1="8" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="vg-check" x1="40" y1="92" x2="88" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- hexagon shell: engineered badge, not the default security shield -->
  <path d="M64 6 L112 33 V95 L64 122 L16 95 V33 Z" fill="url(#vg-shell)"/>

  <!-- inner bevel -->
  <path d="M64 18 L101 39 V89 L64 110 L27 89 V39 Z"
        fill="none" stroke="#C7D2FE" stroke-opacity="0.35" stroke-width="2.5"/>

  <!-- diff hunk: one added line, one removed line -->
  <path d="M36 40 H64" stroke="#34D399" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M36 52 H52" stroke="#F87171" stroke-width="5.5" stroke-linecap="round"/>

  <!-- verdict: the diff passed -->
  <path d="M40 76 L55 91 L87 56"
        fill="none" stroke="url(#vg-check)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
